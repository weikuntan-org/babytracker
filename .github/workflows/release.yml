name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-card-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend-src
        run: npm ci || npm install
      - name: Build card
        working-directory: frontend-src
        run: npm run build
      - name: Fail if built artefact drifted
        run: |
          if [ -n "$(git status --porcelain custom_components/babytracker/frontend/)" ]; then
            echo "Built card artefact does not match the committed file."
            git diff custom_components/babytracker/frontend/
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
