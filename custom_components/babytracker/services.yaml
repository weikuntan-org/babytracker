log_feeding:
  name: Log feeding
  description: Log a completed feeding for a baby.
  fields:
    baby:
      description: Baby slug.
      required: true
      example: ava
      selector:
        text:
    method:
      description: Feeding method.
      required: true
      selector:
        select:
          options:
            - bottle
            - breast_left
            - breast_right
            - solids
    amount:
      description: Amount fed (optional for breast/solids).
      selector:
        number:
          min: 0
          max: 500
          step: 0.5
          mode: box
    unit:
      description: Volume unit for amount.
      selector:
        select:
          options:
            - ml
            - oz
    started_at:
      description: When the feeding started.
      selector:
        datetime:
    ended_at:
      description: When the feeding ended.
      selector:
        datetime:
    notes:
      description: Free-form notes.
      selector:
        text:
    photo_path:
      description: media-source:// path to an attached photo.
      selector:
        text:

start_feeding:
  name: Start feeding
  description: Open a feeding session.
  fields:
    baby:
      required: true
      selector:
        text:
    method:
      required: true
      selector:
        select:
          options:
            - bottle
            - breast_left
            - breast_right
            - solids

end_feeding:
  name: End feeding
  description: Close the currently-open feeding session.
  fields:
    baby:
      required: true
      selector:
        text:
    amount:
      selector:
        number:
          min: 0
          max: 500
          step: 0.5
          mode: box
    unit:
      selector:
        select:
          options:
            - ml
            - oz
    notes:
      selector:
        text:

log_diaper:
  name: Log diaper
  description: Log a diaper change.
  fields:
    baby:
      required: true
      selector:
        text:
    kind:
      required: true
      selector:
        select:
          options:
            - wet
            - dirty
            - both
    notes:
      selector:
        text:
    photo_path:
      selector:
        text:

start_sleep:
  name: Start sleep
  description: Open a sleep session.
  fields:
    baby:
      required: true
      selector:
        text:
    location:
      selector:
        text:

end_sleep:
  name: End sleep
  description: Close the open sleep session.
  fields:
    baby:
      required: true
      selector:
        text:
    notes:
      selector:
        text:

